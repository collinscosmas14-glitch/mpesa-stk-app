<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Pesa STK Push</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7f6;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #222;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #1b8f3a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      background: #e8f7ed;
      color: #176b2d;
    }

    .error {
      background: #fdeaea;
      color: #a11a1a;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>M-Pesa STK Push</h1>

    <p class="subtitle">
      Enter payment details below
    </p>

    <form id="paymentForm">

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="07XXXXXXXX"
        required
      >

      <label for="amount">Amount</label>
      <input
        type="number"
        id="amount"
        placeholder="Enter amount"
        min="1"
        required
      >

      <label for="reference">Account Reference</label>
      <input
        type="text"
        id="reference"
        placeholder="e.g. TEST"
        maxlength="12"
        value="TEST"
        required
      >

      <button type="submit" id="payButton">
        Send STK Push
      </button>

    </form>

    <div id="message"></div>

  </div>

  <script>
    const paymentForm = document.getElementById("paymentForm");
    const payButton = document.getElementById("payButton");
    const message = document.getElementById("message");

    paymentForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const phone = document.getElementById("phone").value.trim();
      const amount = document.getElementById("amount").value.trim();
      const accountReference = document.getElementById("reference").value.trim();

      message.style.display = "none";
      message.className = "";

      payButton.disabled = true;
      payButton.textContent = "Sending...";

      try {
        const response = await fetch("/api/stkpush", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            phone: phone,
            amount: amount,
            accountReference: accountReference
          })
        });

        const result = await response.json();

        message.style.display = "block";

        if (result.success) {
          message.className = "success";
          message.textContent =
            result.message +
            " Response: " +
            JSON.stringify(result.data);
        } else {
          message.className = "error";
          message.textContent =
            result.message +
            " " +
            JSON.stringify(result.error || "");
        }

      } catch (error) {

        message.style.display = "block";
        message.className = "error";
        message.textContent =
          "Connection error. Please try again.";

      } finally {

        payButton.disabled = false;
        payButton.textContent = "Send STK Push";

      }
    });
  </script>

</body>
  </html>
